<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Balmuildy Assembly</title>

<link rel="icon"
href="https://balmuildyprimaryschool.tdf1.uk/balmuildy.png">

<style>

:root{
    --accent:#5b5fc7;
    --accent-dark:#4648a8;
    --bg:#f5f5f7;
    --panel:#ffffff;
    --panel2:#f0f1f5;
    --text:#202124;
    --muted:#6b6f76;
    --border:#e1e2e6;
    --danger:#d93025;
    --success:#16803c;
    --warning:#795900;
    --shadow:0 8px 30px rgba(0,0,0,.08);
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    font-family:Inter,Segoe UI,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    display:flex;
    width:100%;
    height:100vh;
    overflow:hidden;
}

/* SIDEBAR */

.sidebar{
    width:260px;
    background:#202124;
    color:white;
    display:flex;
    flex-direction:column;
    flex-shrink:0;
}

.brand{
    padding:18px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:1px solid rgba(255,255,255,.1);
}

.brand img{
    width:44px;
    height:44px;
    border-radius:10px;
    object-fit:contain;
    background:white;
    padding:3px;
}

.brand-text{
    font-weight:700;
}

.brand-text small{
    display:block;
    opacity:.6;
    font-weight:400;
    margin-top:2px;
}

.nav{
    padding:12px;
}

.nav button{
    width:100%;
    border:0;
    background:transparent;
    color:#ddd;
    padding:12px;
    border-radius:8px;
    text-align:left;
    margin-bottom:4px;
}

.nav button:hover,
.nav button.active{
    background:rgba(255,255,255,.1);
    color:white;
}

.sidebar-bottom{
    margin-top:auto;
    padding:12px;
    border-top:1px solid rgba(255,255,255,.1);
}

.user-mini{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px;
}

.avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    background:var(--accent);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    flex-shrink:0;
}

.user-mini-info{
    min-width:0;
}

.user-mini-info strong{
    display:block;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.user-mini-info small{
    color:#aaa;
}

/* MAIN */

.main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
}

.topbar{
    height:64px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    padding:0 20px;
    gap:15px;
}

.mobile-menu{
    display:none;
    border:0;
    background:none;
    font-size:22px;
}

.search{
    flex:1;
    max-width:600px;
}

.search input{
    width:100%;
    border:1px solid var(--border);
    background:var(--panel2);
    border-radius:8px;
    padding:11px 14px;
    outline:none;
}

.search input:focus{
    border-color:var(--accent);
}

.top-actions{
    margin-left:auto;
    display:flex;
    gap:8px;
}

.icon-btn{
    width:40px;
    height:40px;
    border:0;
    border-radius:8px;
    background:transparent;
}

.icon-btn:hover{
    background:var(--panel2);
}

.content{
    flex:1;
    overflow:auto;
    padding:25px;
}

/* CARDS */

.card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    box-shadow:var(--shadow);
}

.card-header{
    padding:18px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.card-body{
    padding:18px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:18px;
}

.stat{
    padding:20px;
}

.stat-number{
    font-size:30px;
    font-weight:700;
}

.stat-label{
    color:var(--muted);
    margin-top:5px;
}

/* BUTTONS */

.btn{
    border:0;
    border-radius:7px;
    padding:10px 15px;
    font-weight:600;
}

.btn-primary{
    background:var(--accent);
    color:white;
}

.btn-primary:hover{
    background:var(--accent-dark);
}

.btn-secondary{
    background:var(--panel2);
    color:var(--text);
}

.btn-danger{
    background:var(--danger);
    color:white;
}

.btn-success{
    background:var(--success);
    color:white;
}

/* LOGIN */

.auth-screen{
    width:100%;
    min-height:100vh;
    background:
        radial-gradient(circle at top left,#dfe2ff,transparent 40%),
        var(--bg);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.auth-card{
    width:100%;
    max-width:460px;
    background:white;
    border-radius:18px;
    box-shadow:0 20px 70px rgba(0,0,0,.15);
    padding:35px;
}

.auth-logo{
    display:block;
    width:100px;
    height:100px;
    object-fit:contain;
    margin:0 auto 20px;
}

.auth-title{
    text-align:center;
    font-size:27px;
    font-weight:750;
}

.auth-subtitle{
    text-align:center;
    color:var(--muted);
    margin:8px 0 25px;
}

.form-group{
    margin-bottom:16px;
}

.form-group label{
    display:block;
    font-weight:600;
    margin-bottom:7px;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    border:1px solid var(--border);
    border-radius:8px;
    padding:11px;
    outline:none;
    background:white;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
    border-color:var(--accent);
}

.auth-switch{
    text-align:center;
    margin-top:20px;
    color:var(--muted);
}

.auth-switch button{
    background:none;
    border:0;
    color:var(--accent);
    font-weight:700;
}

/* CHAT */

.chat-layout{
    display:grid;
    grid-template-columns:280px 1fr;
    height:calc(100vh - 114px);
    gap:15px;
}

.chat-list{
    overflow:auto;
}

.chat-item{
    padding:13px;
    display:flex;
    gap:10px;
    align-items:center;
    cursor:pointer;
    border-radius:8px;
    margin:3px;
}

.chat-item:hover,
.chat-item.active{
    background:var(--panel2);
}

.chat-main{
    display:flex;
    flex-direction:column;
    min-width:0;
}

.chat-header{
    padding:15px;
    border-bottom:1px solid var(--border);
    background:var(--panel);
    font-weight:700;
}

.messages{
    flex:1;
    overflow:auto;
    padding:20px;
    background:var(--bg);
}

.message{
    display:flex;
    gap:10px;
    margin-bottom:16px;
}

.message.mine{
    flex-direction:row-reverse;
}

.message-bubble{
    max-width:70%;
    background:var(--panel);
    border:1px solid var(--border);
    padding:10px 13px;
    border-radius:12px;
}

.mine .message-bubble{
    background:#e6e7ff;
}

.message-name{
    font-size:12px;
    color:var(--muted);
    margin-bottom:4px;
    font-weight:700;
}

.message-time{
    font-size:10px;
    color:var(--muted);
    margin-top:5px;
}

.chat-input{
    display:flex;
    gap:8px;
    padding:12px;
    border-top:1px solid var(--border);
    background:var(--panel);
}

.chat-input textarea{
    flex:1;
    resize:none;
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px;
    min-height:42px;
    max-height:120px;
}

/* FILES */

.file-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px;
    border-bottom:1px solid var(--border);
}

.file-row:last-child{
    border-bottom:0;
}

.file-icon{
    font-size:26px;
}

.file-info{
    flex:1;
    min-width:0;
}

.file-name{
    font-weight:650;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.file-meta{
    color:var(--muted);
    font-size:12px;
    margin-top:3px;
}

.file-actions{
    display:flex;
    gap:6px;
}

/* GROUPS */

.group-card{
    padding:20px;
    cursor:pointer;
    transition:.15s;
}

.group-card:hover{
    transform:translateY(-2px);
}

/* BADGES */

.badge{
    display:inline-block;
    border-radius:999px;
    padding:4px 9px;
    font-size:11px;
    font-weight:700;
}

.badge-pending{
    background:#fff3cd;
    color:#795900;
}

.badge-approved{
    background:#d9f7e5;
    color:#146c36;
}

.badge-admin{
    background:#e2e4ff;
    color:#41459a;
}

.badge-rejected{
    background:#ffe0df;
    color:#9c1d18;
}

/* EMPTY */

.empty{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
}

/* TOAST */

.toast-container{
    position:fixed;
    bottom:20px;
    right:20px;
    z-index:2000;
}

.toast{
    background:#202124;
    color:white;
    padding:13px 17px;
    border-radius:8px;
    margin-top:8px;
    box-shadow:var(--shadow);
    max-width:400px;
}

/* MOBILE */

@media(max-width:800px){

    .sidebar{
        position:fixed;
        z-index:900;
        left:-270px;
        top:0;
        bottom:0;
        transition:.2s;
    }

    .sidebar.open{
        left:0;
    }

    .mobile-menu{
        display:block;
    }

    .chat-layout{
        grid-template-columns:1fr;
    }

    .chat-list{
        max-height:180px;
    }

    .content{
        padding:15px;
    }

    .topbar{
        padding:0 12px;
    }

    .search{
        max-width:none;
    }

}

</style>

</head>

<body>

<div id="root"></div>

<div id="toast-container" class="toast-container"></div>


<script type="module">

/* ============================================================
   FIREBASE
   ============================================================ */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged,
    updateProfile
}
from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

import {
    getFirestore,
    collection,
    doc,
    addDoc,
    setDoc,
    getDoc,
    getDocs,
    updateDoc,
    deleteDoc,
    query,
    where,
    orderBy,
    onSnapshot,
    serverTimestamp,
    limit
}
from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";


/* ============================================================
   FIREBASE CONFIG
   ============================================================ */

const firebaseConfig = {

    apiKey:
        "AIzaSyClL16WbunPflZ6zZeHfifK2K3XVBUlijBk",

    authDomain:
        "balmuildyprimaryschool.firebaseapp.com",

    projectId:
        "balmuildyprimaryschool",

    messagingSenderId:
        "767459231241",

    appId:
        "1:767459231241:web:1fde490389331f85f35ad8",

    measurementId:
        "G-DCTYENE246"

};


/* ============================================================
   INITIALISE
   ============================================================ */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* ============================================================
   GLOBAL STATE
   ============================================================ */

let currentUser = null;

let currentProfile = null;

let currentView =
    location.hash.replace("#","")
    || "dashboard";

let currentChatId = null;

let currentChatUnsubscribe = null;

let currentFilesUnsubscribe = null;


/* ============================================================
   HELPERS
   ============================================================ */

function escapeHTML(value){

    if(
        value === undefined ||
        value === null
    ){
        return "";
    }

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function initials(name){

    if(!name){
        return "?";
    }

    return name
        .trim()
        .split(/\s+/)
        .map(x => x[0])
        .slice(0,2)
        .join("")
        .toUpperCase();

}


function toast(message){

    const container =
        document.getElementById(
            "toast-container"
        );

    if(!container){
        return;
    }

    const item =
        document.createElement("div");

    item.className =
        "toast";

    item.textContent =
        message;

    container.appendChild(item);

    setTimeout(
        () => item.remove(),
        4500
    );

}


function formatDate(timestamp){

    if(!timestamp){
        return "";
    }

    try{

        return timestamp
            .toDate()
            .toLocaleString();

    }catch{

        return "";

    }

}


/* ============================================================
   NAVIGATION
   ============================================================ */

function navigate(view){

    currentView =
        view;

    location.hash =
        view;

    renderApp();

}


window.addEventListener(
    "hashchange",
    () => {

        currentView =
            location.hash.replace(
                "#",
                ""
            ) || "dashboard";

        renderApp();

    }
);


/* ============================================================
   LOGIN
   ============================================================ */

function renderAuth(){

    document.getElementById(
        "root"
    ).innerHTML = `

        <div class="auth-screen">

            <div class="auth-card">

                <img
                    class="auth-logo"
                    src="https://balmuildyprimaryschool.tdf1.uk/balmuildy.png"
                    alt="Balmuildy logo"
                >

                <div class="auth-title">
                    Balmuildy Assembly
                </div>

                <div class="auth-subtitle">
                    Sign in to your school workspace
                </div>

                <form id="login-form">

                    <div class="form-group">

                        <label>Email</label>

                        <input
                            id="login-email"
                            type="email"
                            autocomplete="email"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label>Password</label>

                        <input
                            id="login-password"
                            type="password"
                            autocomplete="current-password"
                            required
                        >

                    </div>

                    <button
                        class="btn btn-primary"
                        style="width:100%"
                        type="submit"
                    >
                        Sign in
                    </button>

                </form>

                <div class="auth-switch">

                    Don't have an account?

                    <button id="show-signup">
                        Create account
                    </button>

                </div>

            </div>

        </div>

    `;


    document
        .getElementById("login-form")
        .addEventListener(
            "submit",
            login
        );


    document
        .getElementById("show-signup")
        .addEventListener(
            "click",
            renderSignup
        );

}


function renderSignup(){

    document.getElementById(
        "root"
    ).innerHTML = `

        <div class="auth-screen">

            <div class="auth-card">

                <img
                    class="auth-logo"
                    src="https://balmuildyprimaryschool.tdf1.uk/balmuildy.png"
                    alt="Balmuildy logo"
                >

                <div class="auth-title">
                    Join Balmuildy Assembly
                </div>

                <div class="auth-subtitle">
                    Your account must be approved by an administrator.
                </div>

                <form id="signup-form">

                    <div class="form-group">

                        <label>Display name</label>

                        <input
                            id="signup-name"
                            maxlength="50"
                            placeholder="Your name"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label>Email</label>

                        <input
                            id="signup-email"
                            type="email"
                            autocomplete="email"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label>Password</label>

                        <input
                            id="signup-password"
                            type="password"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                    </div>

                    <button
                        class="btn btn-primary"
                        style="width:100%"
                        type="submit"
                    >
                        Request access
                    </button>

                </form>

                <div class="auth-switch">

                    Already have an account?

                    <button id="show-login">
                        Sign in
                    </button>

                </div>

            </div>

        </div>

    `;


    document
        .getElementById("signup-form")
        .addEventListener(
            "submit",
            signup
        );


    document
        .getElementById("show-login")
        .addEventListener(
            "click",
            renderAuth
        );

}


/* ============================================================
   LOGIN FUNCTION
   ============================================================ */

async function login(event){

    event.preventDefault();

    const email =
        document
        .getElementById("login-email")
        .value
        .trim();

    const password =
        document
        .getElementById("login-password")
        .value;

    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    }catch(error){

        console.error(
            "LOGIN ERROR",
            error
        );

        toast(
            friendlyAuthError(error)
        );

    }

}


/* ============================================================
   SIGNUP FUNCTION
   ============================================================ */

async function signup(event){

    event.preventDefault();


    const name =
        document
        .getElementById("signup-name")
        .value
        .trim();

    const email =
        document
        .getElementById("signup-email")
        .value
        .trim();

    const password =
        document
        .getElementById("signup-password")
        .value;


    if(!name){

        toast(
            "Please enter a display name."
        );

        return;

    }


    if(!email){

        toast(
            "Please enter an email address."
        );

        return;

    }


    if(password.length < 8){

        toast(
            "Password must be at least 8 characters."
        );

        return;

    }


    try{

        toast(
            "Creating account..."
        );


        /* CREATE AUTH USER */

        const credential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user =
            credential.user;


        console.log(
            "Firebase Auth account created:",
            user.uid
        );


        /* SET AUTH DISPLAY NAME */

        await updateProfile(
            user,
            {
                displayName:name
            }
        );


        console.log(
            "Firebase Auth profile updated."
        );


        /* CREATE FIRESTORE USER DOCUMENT */

        await setDoc(
            doc(
                db,
                "users",
                user.uid
            ),
            {

                uid:
                    user.uid,

                email:
                    email,

                displayName:
                    name,

                role:
                    "member",

                status:
                    "pending",

                createdAt:
                    serverTimestamp()

            }
        );


        console.log(
            "Firestore user document created."
        );


        toast(
            "Account created. Waiting for approval."
        );


        await signOut(
            auth
        );


        renderAuth();


    }catch(error){

        console.error(
            "SIGNUP ERROR:",
            error
        );


        toast(
            friendlyAuthError(error)
        );

    }

}


/* ============================================================
   ERROR MESSAGES
   ============================================================ */

function friendlyAuthError(error){

    if(
        error?.code ===
        "auth/email-already-in-use"
    ){

        return "That email address is already registered.";

    }


    if(
        error?.code ===
        "auth/invalid-email"
    ){

        return "Please enter a valid email address.";

    }


    if(
        error?.code ===
        "auth/weak-password"
    ){

        return "The password is too weak.";

    }


    if(
        error?.code ===
        "auth/invalid-credential"
    ){

        return "Incorrect email or password.";

    }


    if(
        error?.code ===
        "auth/user-not-found"
    ){

        return "Incorrect email or password.";

    }


    if(
        error?.code ===
        "auth/wrong-password"
    ){

        return "Incorrect email or password.";

    }


    if(
        error?.code ===
        "permission-denied"
    ){

        return "Firestore permission denied. Check your Firestore rules.";

    }


    return error?.message ||
        "Something went wrong.";

}


/* ============================================================
   LOAD PROFILE
   ============================================================ */

async function loadProfile(){

    if(!currentUser){

        return null;

    }


    const snapshot =
        await getDoc(
            doc(
                db,
                "users",
                currentUser.uid
            )
        );


    if(!snapshot.exists()){

        return null;

    }


    return {

        id:
            snapshot.id,

        ...snapshot.data()

    };

}


/* ============================================================
   MAIN APP
   ============================================================ */

function renderApp(){

    if(!currentUser){

        renderAuth();

        return;

    }


    if(!currentProfile){

        document.getElementById(
            "root"
        ).innerHTML = `

            <div class="auth-screen">

                <div class="auth-card">

                    <div class="auth-title">
                        Loading...
                    </div>

                    <p style="text-align:center;color:var(--muted)">
                        Loading your Balmuildy Assembly account.
                    </p>

                </div>

            </div>

        `;

        return;

    }


    if(
        currentProfile.status !==
        "approved"
    ){

        renderPending();

        return;

    }


    renderShell();

}


/* ============================================================
   PENDING SCREEN
   ============================================================ */

function renderPending(){

    const rejected =
        currentProfile.status ===
        "rejected";


    document.getElementById(
        "root"
    ).innerHTML = `

        <div class="auth-screen">

            <div class="auth-card">

                <img
                    class="auth-logo"
                    src="https://balmuildyprimaryschool.tdf1.uk/balmuildy.png"
                    alt="Balmuildy logo"
                >

                <div class="auth-title">

                    ${
                        rejected
                        ? "Access declined"

async function loadChats(){

    const container =
        document.getElementById(
            "chat-list-content"
        );


    try{

        const snapshot =
            await getDocs(
                query(
                    collection(db,"chats"),
                    where(
                        "participants",
                        "array-contains",
                        currentUser.uid
                    ),
                    limit(50)
                )
            );


        if(snapshot.empty){

            container.innerHTML = `

                <div class="empty">

                    No chats yet.

                    <br><br>

                    Go to Members and select someone.

                </div>

            `;

            return;

        }


        let html = "";


        for(
            const chatDoc
            of snapshot.docs
        ){

            const chat =
                chatDoc.data();


            const otherUid =
                chat.participants.find(
                    uid =>
                        uid !== currentUser.uid
                );


            if(!otherUid){
                continue;
            }


            const other =
                await getDoc(
                    doc(
                        db,
                        "users",
                        otherUid
                    )
                );


            if(!other.exists()){
                continue;
            }


            const user =
                other.data();


            html += `

                <div
                    class="chat-item"
                    onclick="window.openChat(
                        '${chatDoc.id}',
                        '${escapeHTML(user.displayName)}'
                    )"
                >

                    <div class="avatar">
                        ${initials(user.displayName)}
                    </div>

                    <div>

                        <strong>
                            ${escapeHTML(user.displayName)}
                        </strong>

                    </div>

                </div>

            `;

        }


        container.innerHTML =
            html ||
            `<div class="empty">No chats yet.</div>`;


    }catch(error){

        console.error(
            "CHAT ERROR:",
            error
        );


        container.innerHTML = `

            <div class="empty">

                Unable to load chats.

                <br><br>

                <small>
                    ${escapeHTML(error.message)}
                </small>

            </div>

        `;

    }

}


/* ============================================================
   START CHAT
   ============================================================ */

async function startChat(otherUid){

    try{

        const snapshot =
            await getDocs(
                query(
                    collection(db,"chats"),
                    where(
                        "participants",
                        "array-contains",
                        currentUser.uid
                    )
                )
            );


        for(
            const item
            of snapshot.docs
        ){

            const chat =
                item.data();


            if(
                chat.participants.length === 2 &&
                chat.participants.includes(otherUid)
            ){

                const other =
                    await getDoc(
                        doc(
                            db,
                            "users",
                            otherUid
                        )
                    );


                const name =
                    other.exists()
                    ? other.data().displayName
                    : "Chat";


                navigate("chat");


                setTimeout(
                    () =>
                        openChat(
                            item.id,
                            name
                        ),
                    300
                );


                return;

            }

        }


        const chatRef =
            await addDoc(
                collection(db,"chats"),
                {

                    participants:[
                        currentUser.uid,
                        otherUid
                    ],

                    type:
                        "direct",

                    createdAt:
                        serverTimestamp(),

                    lastMessage:
                        ""

                }
            );


        const other =
            await getDoc(
                doc(
                    db,
                    "users",
                    otherUid
                )
            );


        navigate("chat");


        setTimeout(
            () =>
                openChat(
                    chatRef.id,
                    other.exists()
                    ? other.data().displayName
                    : "Chat"
                ),
            300
        );


    }catch(error){

        toast(
            "Unable to start chat: " +
            error.message
        );

    }

}


/* ============================================================
   OPEN CHAT
   ============================================================ */

function openChat(chatId,name){

    currentChatId =
        chatId;


    const header =
        document.getElementById(
            "chat-header"
        );


    if(header){

        header.textContent =
            name;

    }


    const input =
        document.getElementById(
            "message-input"
        );


    const button =
        document.getElementById(
            "send-message"
        );


    if(input){
        input.disabled = false;
    }


    if(button){
        button.disabled = false;
    }


    if(currentChatUnsubscribe){

        currentChatUnsubscribe();

    }


    const messagesQuery =
        query(
            collection(
                db,
                "chats",
                chatId,
                "messages"
            ),
            orderBy(
                "createdAt",
                "asc"
            )
        );


    currentChatUnsubscribe =
        onSnapshot(
            messagesQuery,

            snapshot => {

                const container =
                    document.getElementById(
                        "messages"
                    );


                if(!container){
                    return;
                }


                let html = "";


                snapshot.forEach(
                    messageDoc => {

                        const message =
                            messageDoc.data();


                        const mine =
                            message.senderId ===
                            currentUser.uid;


                        html += `

                            <div
                                class="message ${mine ? "mine" : ""}"
                            >

                                <div class="avatar">
                                    ${initials(message.senderName)}
                                </div>

                                <div class="message-bubble">

                                    <div class="message-name">
                                        ${escapeHTML(message.senderName)}
                                    </div>

                                    <div>
                                        ${escapeHTML(message.text)}
                                    </div>

                                    <div class="message-time">
                                        ${formatDate(message.createdAt)}
                                    </div>

                                </div>

                            </div>

                        `;

                    }
                );


                container.innerHTML =
                    html ||
                    `<div class="empty">No messages yet.</div>`;


                container.scrollTop =
                    container.scrollHeight;

            },

            error => {

                console.error(
                    "MESSAGE LISTENER ERROR:",
                    error
                );


                toast(
                    "Unable to load messages."
                );

            }
        );

}


/* ============================================================
   SEND MESSAGE
   ============================================================ */

async function sendMessage(event){

    event.preventDefault();


    if(!currentChatId){
        return;
    }


    const input =
        document.getElementById(
            "message-input"
        );


    const text =
        input.value.trim();


    if(!text){
        return;
    }


    input.value =
        "";


    try{

        await addDoc(
            collection(
                db,
                "chats",
                currentChatId,
                "messages"
            ),
            {

                senderId:
                    currentUser.uid,

                senderName:
                    currentProfile.displayName,

                text:
                    text,

                createdAt:
                    serverTimestamp()

            }
        );


        await updateDoc(
            doc(
                db,
                "chats",
                currentChatId
            ),
            {

                lastMessage:
                    text,

                lastMessageAt:
                    serverTimestamp()

            }
        );


    }catch(error){

        console.error(
            "SEND MESSAGE ERROR:",
            error
        );


        toast(
            "Unable to send message: " +
            error.message
        );

    }

}

            "Group description:"
        ) || "";


    try{

        await addDoc(
            collection(db,"groups"),
            {

                name:
                    name.trim(),

                description:
                    description.trim(),

                ownerId:
                    currentUser.uid,

                members:[
                    currentUser.uid
                ],

                createdAt:
                    serverTimestamp()

            }
        );


        toast(
            "Group created."
        );


        renderGroups();


    }catch(error){

        toast(
            "Unable to create group: " +
            error.message
        );

    }

}


/* ============================================================
   ADMIN
   ============================================================ */

async function renderAdmin(){

    if(
        currentProfile.role !==
        "admin"
    ){

        navigate(
            "dashboard"
        );

        return;

    }


    const page =
        document.getElementById(
            "page-content"
        );


    page.innerHTML = `

        <h1>
            Administration
        </h1>

        <p style="color:var(--muted)">
            Manage Balmuildy Assembly members.
        </p>


        <div class="card">

            <div class="card-header">
                Pending accounts
            </div>

            <div id="pending-users">
                Loading...
            </div>

        </div>


        <br>


        <div class="card">

            <div class="card-header">
                Approved members
            </div>

            <div id="approved-users">
                Loading...
            </div>

        </div>

    `;


    await loadPendingUsers();

    await loadApprovedUsers();

}


/* ============================================================
   PENDING USERS
   ============================================================ */

async function loadPendingUsers(){

    const container =
        document.getElementById(
            "pending-users"
        );


    try{

        const snapshot =
            await getDocs(
                query(
                    collection(db,"users"),
                    where(
                        "status",
                        "==",
                        "pending"
                    )
                )
            );


        if(snapshot.empty){

            container.innerHTML = `

                <div class="empty">

                    No pending accounts.

                </div>

            `;

            return;

        }


        let html = "";


        snapshot.forEach(
            userDoc => {

                const user =
                    userDoc.data();


                html += `

                    <div class="file-row">

                        <div class="avatar">
                            ${initials(user.displayName)}
                        </div>


                        <div class="file-info">

                            <div class="file-name">
                                ${escapeHTML(user.displayName)}
                            </div>

                            <div class="file-meta">
                                ${escapeHTML(user.email)}
                            </div>

                        </div>


                        <button
                            class="btn btn-success"
                            onclick="window.approveUser('${userDoc.id}')"
                        >
                            Approve
                        </button>


                        <button
                            class="btn btn-danger"
                            onclick="window.rejectUser('${userDoc.id}')"
                        >
                            Reject
                        </button>

                    </div>

                `;

            }
        );


        container.innerHTML =
            html;


    }catch(error){

        console.error(
            "PENDING USERS ERROR:",
            error
        );


        container.innerHTML = `

            <div class="empty">

                Unable to load pending users.

                <br><br>

                <small>
                    ${escapeHTML(error.message)}
                </small>

            </div>

        `;

    }

}


/* ============================================================
   APPROVED USERS
   ============================================================ */

async function loadApprovedUsers(){

    const container =
        document.getElementById(
            "approved-users"
        );


    try{

        const snapshot =
            await getDocs(
                query(
                    collection(db,"users"),
                    where(
                        "status",
                        "==",
                        "approved"
                    )
                )
            );


        if(snapshot.empty){

            container.innerHTML = `

                <div class="empty">

                    No approved members.

                </div>

            `;

            return;

        }


        let html = "";


        snapshot.forEach(
            userDoc => {

                const user =
                    userDoc.data();


                html += `

                    <div class="file-row">

                        <div class="avatar">
                            ${initials(user.displayName)}
                        </div>


                        <div class="file-info">

                            <div class="file-name">
                                ${escapeHTML(user.displayName)}
                            </div>

                            <div class="file-meta">
                                ${escapeHTML(user.email)}
                            </div>

                        </div>


                        ${
                            user.role === "admin"

                            ? `
                                <span class="badge badge-admin">
                                    ADMIN
                                </span>
                              `

                            : ""

                        }


                        ${
                            userDoc.id !== currentUser.uid

                            ? `

                                <button
                                    class="btn btn-danger"
                                    onclick="window.removeMember('${userDoc.id}')"
                                >
                                    Remove
                                </button>

                              `

                            : ""

                        }

                    </div>

                `;

            }
        );


        container.innerHTML =
            html;


    }catch(error){

        container.innerHTML = `

            <div class="empty">

                Unable to load approved members.

                <br><br>

                <small>
                    ${escapeHTML(error.message)}
                </small>

            </div>

        `;

    }

}

        toast(

function renderProfile(){

/* ============================================================
   SAVE PROFILE
   ============================================================ */

async function saveProfile(){

    const input =
        document.getElementById(
            "profile-name"
        );


    const name =
        input.value.trim();


    if(!name){

        toast(
            "Enter a display name."
        );

        return;

    }


    try{

        await updateDoc(
            doc(
                db,
                "users",
                currentUser.uid
            ),
            {

                displayName:
                    name

            }
        );


        await updateProfile(
            currentUser,
            {

                displayName:
                    name

            }
        );


        currentProfile.displayName =
            name;


        toast(
            "Profile updated."
        );


        renderShell();


    }catch(error){

        toast(
            "Unable to update profile: " +
            error.message
        );

    }

}


/* ============================================================
   SEARCH
   ============================================================ */

function globalSearch(event){

    if(
        event.key !==
        "Enter"
    ){

        return;

    }


    const value =
        event.target.value.trim();


    if(!value){
        return;
    }


    toast(
        "Search: " +
        value
    );

}


/* ============================================================
   MOBILE SIDEBAR
   ============================================================ */

function toggleSidebar(){

    const sidebar =
        document.getElementById(
            "sidebar"
        );


    if(sidebar){

        sidebar.classList.toggle(
            "open"
        );

    }

}


/* ============================================================
   LOGOUT
   ============================================================ */

async function logout(){

    if(currentChatUnsubscribe){

        currentChatUnsubscribe();

        currentChatUnsubscribe =
            null;

    }


    if(currentFilesUnsubscribe){

        currentFilesUnsubscribe();

        currentFilesUnsubscribe =
            null;

    }


    currentUser =
        null;

    currentProfile =
        null;


    await signOut(
        auth
    );

}

/* ============================================================
   FIREBASE AUTH STATE
   ============================================================ */

onAuthStateChanged(
    auth,

    async user => {

        currentUser =
            user;


        if(!user){

            currentProfile =
                null;

            renderAuth();

            return;

        }


        try{

            currentProfile =
                await loadProfile();


            if(!currentProfile){

                console.error(
                    "No Firestore user document found for:",
                    user.uid
                );


                document.getElementById(
                    "root"
                ).innerHTML = `

                    <div class="auth-screen">

                        <div class="auth-card">

                            <img
                                class="auth-logo"
                                src="https://balmuildyprimaryschool.tdf1.uk/balmuildy.png"
                            >

                            <div class="auth-title">
                                Account setup incomplete
                            </div>

                            <p style="
                                text-align:center;
                                color:var(--muted);
                                line-height:1.6
                            ">

                                Your Firebase Authentication
                                account exists, but your Balmuildy
                                Assembly Firestore profile could
                                not be found.

                            </p>

                            <button
                                class="btn btn-secondary"
                                style="width:100%"
                                onclick="window.logout()"
                            >
                                Sign out
                            </button>

                        </div>

                    </div>

                `;

                return;

            }


            const hash =
                location.hash.replace(
                    "#",
                    ""
                );


            if(hash){

                currentView =
                    hash;

            }


            renderApp();


        }catch(error){

            console.error(
                "AUTH/PROFILE ERROR:",
                error
            );


            document.getElementById(
                "root"
            ).innerHTML = `

                <div class="auth-screen">

                    <div class="auth-card">

                        <div class="auth-title">
                            Unable to load account
                        </div>

                        <p style="
                            color:var(--muted);
                            text-align:center
                        ">
                            ${escapeHTML(error.message)}
                        </p>

                        <button
                            class="btn btn-secondary"
                            style="width:100%"
                            onclick="window.logout()"
                        >
                            Sign out
                        </button>

                    </div>

                </div>

            `;

        }

    }

);


/* ============================================================
   INITIAL LOAD
   ============================================================ */

if(!location.hash){

    location.hash =
        "dashboard";

}
