<!DOCTYPE html>

<meta charset="UTF-8">

<style>

html,
body{

/* ============================================================
   HELPERS
   ============================================================ */

function escapeHTML(value){

    if(value === undefined || value === null){
        return "";
    }

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function initials(name){

    if(!name){
        return "?";
    }

    return name
        .trim()
        .split(/\s+/)
        .map(x => x[0])
        .slice(0,2)
        .join("")
        .toUpperCase();
}


function toast(message){

    const container =
        document.getElementById("toast-container");

    if(!container){
        return;
    }

    const item =
        document.createElement("div");

    item.className = "toast";

    item.textContent = message;

    container.appendChild(item);

    setTimeout(
        () => item.remove(),
        4500
    );
}


function formatDate(timestamp){

    if(!timestamp){
        return "";
    }

    try{

        if(
            typeof timestamp.toDate === "function"
        ){

            return timestamp
                .toDate()
                .toLocaleString();

        }

        if(
            timestamp instanceof Date
        ){

            return timestamp.toLocaleString();

        }

        const date =
            new Date(timestamp);

        if(
            Number.isNaN(
                date.getTime()
            )
        ){

            return "";

        }

        return date.toLocaleString();

    }catch{

        return "";

    }
}


function safeJson(value){

    return JSON.stringify(value)
        .replace(/</g,"\\u003c")
        .replace(/>/g,"\\u003e")
        .replace(/&/g,"\\u0026");
}

/* ============================================================
   LOGIN
   ============================================================ */

async function login(event){

    event.preventDefault();

    const email =
        document
            .getElementById("login-email")
            .value
            .trim();

    const password =
        document
            .getElementById("login-password")
            .value;

    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    }catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );

        toast(
            friendlyAuthError(error)
        );
    }
}


/* ============================================================
   SIGNUP
   ============================================================ */

async function signup(event){

    event.preventDefault();

    const name =
        document
            .getElementById("signup-name")
            .value
            .trim();

    const email =
        document
            .getElementById("signup-email")
            .value
            .trim();

    const password =
        document
            .getElementById("signup-password")
            .value;


    if(!name){

        toast("Please enter a display name.");

        return;
    }


    if(!email){

        toast("Please enter an email address.");

        return;
    }


    if(password.length < 8){

        toast(
            "Password must be at least 8 characters."
        );

        return;
    }


    try{

        toast("Creating account...");


        const credential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user =
            credential.user;


        await updateProfile(
            user,
            {
                displayName:name
            }
        );


        await setDoc(
            doc(
                db,
                "users",
                user.uid
            ),
            {

                uid:user.uid,

                email:email,

                displayName:name,

                role:"member",

                status:"pending",

                createdAt:serverTimestamp()

            }
        );


        toast(
            "Account created. Waiting for approval."
        );


        await signOut(auth);


        renderAuth();


    }catch(error){

        console.error(
            "SIGNUP ERROR:",
            error
        );

        toast(
            friendlyAuthError(error)
        );
    }
}


/* ============================================================
   FIREBASE ERROR MESSAGES
   ============================================================ */

function friendlyAuthError(error){

    const code =
        error?.code || "";


    switch(code){

        case "auth/email-already-in-use":
            return "That email address is already registered.";

        case "auth/invalid-email":
            return "Please enter a valid email address.";

        case "auth/weak-password":
            return "The password is too weak.";

        case "auth/invalid-credential":
            return "Incorrect email or password.";

        case "auth/user-not-found":
            return "Incorrect email or password.";

        case "auth/wrong-password":
            return "Incorrect email or password.";

        case "permission-denied":
            return "Firestore permission denied. Check your Firestore rules.";

        default:
            return error?.message ||
                "Something went wrong.";

    }
}


/* ============================================================
   LOAD PROFILE
   ============================================================ */

async function loadProfile(){

    if(!currentUser){

        return null;

    }


    const snapshot =
        await getDoc(
            doc(
                db,
                "users",
                currentUser.uid
            )
        );


    if(!snapshot.exists()){

        return null;

    }


    return {
        id:snapshot.id,
        ...snapshot.data()
    };
}

/* ============================================================
   LOAD CHATS
   ============================================================ */

async function loadChats(){

    const container =
        document.getElementById(
            "chat-list-content"
        );


    try{

        const snapshot =
            await getDocs(
                query(
                    collection(db,"chats"),
                    where(
                        "participants",
                        "array-contains",
                        currentUser.uid
                    ),
                    limit(50)
                )
            );


        if(snapshot.empty){

            container.innerHTML = `

                <div class="empty">

                    No chats yet.

                    <br><br>

                    Go to Members and select someone.

                </div>

            `;

            return;
        }


        let html = "";


        for(
            const chatDoc of snapshot.docs
        ){

            const chat =
                chatDoc.data();


            const otherUid =
                Array.isArray(chat.participants)
                ? chat.participants.find(
                    uid =>
                        uid !== currentUser.uid
                )
                : null;


            if(!otherUid){
                continue;
            }


            const other =
                await getDoc(
                    doc(
                        db,
                        "users",
                        otherUid
                    )
                );


            if(!other.exists()){
                continue;
            }


            const user =
                other.data();


            html += `

                <div
                    class="chat-item"
                    onclick="window.openChat(
                        ${safeJson(chatDoc.id)},
                        ${safeJson(user.displayName || "Chat")}
                    )"
                >

                    <div class="avatar">
                        ${initials(user.displayName)}
                    </div>

                    <div>

                        <strong>
                            ${escapeHTML(user.displayName)}
                        </strong>

                    </div>

                </div>

            `;
        }


        container.innerHTML =
            html ||
            `<div class="empty">No chats yet.</div>`;


    }catch(error){

        console.error(
            "CHAT ERROR:",
            error
        );


        container.innerHTML = `

            <div class="empty">

                Unable to load chats.

                <br><br>

                <small>
                    ${escapeHTML(error.message)}
                </small>

            </div>

        `;
    }
}


/* ============================================================
   START CHAT
   ============================================================ */

async function startChat(otherUid){

    try{

        const snapshot =
            await getDocs(
                query(
                    collection(db,"chats"),
                    where(
                        "participants",
                        "array-contains",
                        currentUser.uid
                    )
                )
            );


        for(
            const item of snapshot.docs
        ){

            const chat =
                item.data();


            if(
                Array.isArray(chat.participants) &&
                chat.participants.length === 2 &&
                chat.participants.includes(otherUid)
            ){

                const other =
                    await getDoc(
                        doc(
                            db,
                            "users",
                            otherUid
                        )
                    );


                const name =
                    other.exists()
                    ? other.data().displayName
                    : "Chat";


                navigate("chat");


                setTimeout(
                    () =>
                        openChat(
                            item.id,
                            name
                        ),
                    250
                );


                return;
            }
        }


        const chatRef =
            await addDoc(
                collection(db,"chats"),
                {

                    participants:[
                        currentUser.uid,
                        otherUid
                    ],

                    type:"direct",

                    createdAt:
                        serverTimestamp(),

                    lastMessage:""

                }
            );


        const other =
            await getDoc(
                doc(
                    db,
                    "users",
                    otherUid
                )
            );


        navigate("chat");


        setTimeout(
            () =>
                openChat(
                    chatRef.id,
                    other.exists()
                    ? other.data().displayName
                    : "Chat"
                ),
            250
        );


    }catch(error){

        console.error(
            "START CHAT ERROR:",
            error
        );

        toast(
            "Unable to start chat: " +
            error.message
        );
    }
}


/* ============================================================
   OPEN CHAT
   ============================================================ */

function openChat(chatId,name){

    currentChatId = chatId;


    const header =
        document.getElementById("chat-header");


    if(header){
        header.textContent = name || "Chat";
    }


    const input =
        document.getElementById("message-input");


    const button =
        document.getElementById("send-message");


    if(input){
        input.disabled = false;
    }


    if(button){
        button.disabled = false;
    }


    if(currentChatUnsubscribe){

        currentChatUnsubscribe();

        currentChatUnsubscribe = null;
    }


    const messagesQuery =
        query(
            collection(
                db,
                "chats",
                chatId,
                "messages"
            ),
            orderBy(
                "createdAt",
                "asc"
            )
        );


    currentChatUnsubscribe =
        onSnapshot(
            messagesQuery,

            snapshot => {

                const container =
                    document.getElementById("messages");


                if(!container){
                    return;
                }


                let html = "";


                snapshot.forEach(
                    messageDoc => {

                        const message =
                            messageDoc.data();


                        const mine =
                            message.senderId ===
                            currentUser.uid;


                        html += `

                            <div
                                class="message ${mine ? "mine" : ""}"
                            >

                                <div class="avatar">
                                    ${initials(message.senderName)}
                                </div>

                                <div class="message-bubble">

                                    <div class="message-name">
                                        ${escapeHTML(message.senderName)}
                                    </div>

                                    <div>
                                        ${escapeHTML(message.text)}
                                    </div>

                                    <div class="message-time">
                                        ${formatDate(message.createdAt)}
                                    </div>

                                </div>

                            </div>

                        `;
                    }
                );


                container.innerHTML =
                    html ||
                    `<div class="empty">No messages yet.</div>`;


                container.scrollTop =
                    container.scrollHeight;

            },

            error => {

                console.error(
                    "MESSAGE LISTENER ERROR:",
                    error
                );


                toast(
                    "Unable to load messages: " +
                    error.message
                );

            }
        );
}

async function sendMessage(event){

    const input =
        document.getElementById(

    const text =

    input.value = "";

            collection(
                db,
                "chats",
                currentChatId,
                "messages"
            ),
            {

                senderId:
                    currentUser.uid,

                senderName:
                    currentProfile.displayName,

                text:text,

        await updateDoc(
            doc(

                "chats",
                currentChatId

            {

                lastMessage:
                    text,

                lastMessageAt:
                    serverTimestamp()

            }
        );


    }catch(error){

        console.error(
            "SEND MESSAGE ERROR:",
            error
        );


        toast(
            "Unable to send message: " +
            error.message
        );
    }

/* ============================================================

   ============================================================ */

async function getFileAuthToken(){

    if(!currentUser){

        throw new Error(
            "You must be signed in to use files."
        );

    }


    return await currentUser.getIdToken();
}


/* ============================================================
   LOAD FILES
   ============================================================ */

async function loadFiles(){

    const container =
        document.getElementById("files-list");


    if(!container){
        return;
    }


    container.innerHTML = `
        <div class="empty">
            Loading files...
        </div>
    `;


    try{

        const token =
            await getFileAuthToken();


        const response =
            await fetch(
                FILE_API + "/files",
                {
                    method:"GET",
                    headers:{
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        if(!response.ok){

            let message =
                "Unable to load files.";

            try{

                const data =
                    await response.json();

                if(data?.error){
                    message = data.error;
                }

            }catch{

            }

            throw new Error(message);
        }


        const files =
            await response.json();


        if(
            !Array.isArray(files) ||
            files.length === 0
        ){

            container.innerHTML = `
                <div class="empty">
                    No files yet.
                </div>
            `;

            return;
        }


        let html = "";


        files.forEach(
            file => {

                const fileName =
                    file.name ||
                    file.filename ||
                    "Unnamed file";


                const ownerName =
                    file.ownerName ||
                    "";


                const createdAt =
                    file.createdAt
                    ? new Date(
                        file.createdAt
                    ).toLocaleString()
                    : "";


                html += `

                    <div class="file-row">

                        <div class="file-icon">
                            FILE
                        </div>

                        <div class="file-info">

                            <div class="file-name">
                                ${escapeHTML(fileName)}
                            </div>

                            <div class="file-meta">

                                ${escapeHTML(ownerName)}

                                ${
                                    ownerName && createdAt
                                    ? " · "
                                    : ""
                                }

                                ${escapeHTML(createdAt)}

                            </div>

                        </div>


                        <div class="file-actions">

                            <button
                                class="btn btn-secondary"
                                onclick="window.openFile(${safeJson(fileName)})"
                            >
                                Open
                            </button>


                            <button
                                class="btn btn-danger"
                                onclick="window.deleteFile(${safeJson(fileName)})"
                            >
                                Delete
                            </button>

                        </div>

                    </div>

                `;
            }
        );


        container.innerHTML = html;


    }catch(error){

        console.error(
            "FILES ERROR:",
            error
        );


        container.innerHTML = `

            <div class="empty">

                Unable to load files.

                <br><br>

                <small>
                    ${escapeHTML(error.message)}
                </small>

            </div>

        `;
    }
}


/* ============================================================
   UPLOAD FILE
   ============================================================ */

async function uploadFile(){

    const input =
        document.getElementById(
            "file-upload"
        );


    const progress =
        document.getElementById(
            "upload-progress"
        );


    const button =
        document.getElementById(
            "upload-file-button"
        );


    if(!input){
        return;
    }


    if(
        !input.files ||
        !input.files.length
    ){

        toast(
            "Please select a file."
        );

        return;
    }


    const file =
        input.files[0];


    try{

        button.disabled = true;


        progress.textContent =
            "Uploading " +
            file.name +
            "...";


        const token =
            await getFileAuthToken();


        const formData =
            new FormData();


        formData.append(
            "file",
            file
        );


        formData.append(
            "ownerId",
            currentUser.uid
        );


        formData.append(
            "ownerName",
            currentProfile.displayName
        );


        formData.append(
            "ownerEmail",
            currentProfile.email
        );


        const response =
            await fetch(
                FILE_API + "/upload",
                {
                    method:"POST",

                    headers:{
                        "Authorization":
                            "Bearer " + token
                    },

                    body:formData
                }
            );


        if(!response.ok){

            let message =
                "Upload failed.";

            try{

                const data =
                    await response.json();

                if(data?.error){
                    message = data.error;
                }

            }catch{

            }

            throw new Error(message);
        }


        input.value = "";

        progress.textContent = "";

        toast(
            "File uploaded successfully."
        );


        await loadFiles();


    }catch(error){

        console.error(
            "UPLOAD ERROR:",
            error
        );


        progress.textContent = "";


        toast(
            "Unable to upload file: " +
            error.message
        );


    }finally{

        button.disabled = false;

    }
}


/* ============================================================

   ============================================================ */

async function deleteFile(fileName){

    if(
        !confirm(
            "Delete this file?"
        )
    ){

        return;
    }


    try{

        const token =
            await getFileAuthToken();


        const response =
            await fetch(
                FILE_API +
                "/files/" +
                encodeURIComponent(fileName),
                {
                    method:"DELETE",

                    headers:{
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        if(!response.ok){

            let message =
                "Unable to delete file.";

            try{

                const data =
                    await response.json();

                if(data?.error){
                    message = data.error;
                }

            }catch{

            }

            throw new Error(message);
        }


        toast(
            "File deleted."
        );


        await loadFiles();


    }catch(error){

        console.error(
            "DELETE FILE ERROR:",
            error
        );


        toast(
            "Unable to delete file: " +
            error.message
        );
    }
}

                FILE_API +
                "/files/" +
                encodeURIComponent(fileName),
                {
                    method:"GET",

                    headers:{
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );


        if(!response.ok){

            let message =
                "Unable to open file.";

            try{

                const data =
                    await response.json();

                if(data?.error){
                    message = data.error;
                }

            }catch{

            }

            throw new Error(message);
        }


        const blob =
            await response.blob();


        const url =
            URL.createObjectURL(blob);


        window.open(
            url,
            "_blank",
            "noopener,noreferrer"
        );


        setTimeout(
            () =>
                URL.revokeObjectURL(url),
            60000
        );


    }catch(error){

        console.error(
            "OPEN FILE ERROR:",
            error
        );


        toast(
            "Unable to open file: " +
            error.message
        );
    }
}

async function renderGroups(){

        );
    }
}


/* ============================================================

   ============================================================ */

async function createGroup(){

    const name =
        prompt(
            "Group name:"
        );


    if(!name || !name.trim()){
        return;
    }


    const description =
        prompt(
            "Group description:"
        ) || "";


    try{

        await addDoc(
            collection(db,"groups"),
            {

                name:name.trim(),

                description:description.trim(),

                ownerId:
                    currentUser.uid,

                members:[
                    currentUser.uid
                ],

                createdAt:
                    serverTimestamp()

            }
        );


        toast(
            "Group created."
        );


        await renderGroups();


    }catch(error){

        console.error(
            "CREATE GROUP ERROR:",
            error
        );


        toast(
            "Unable to create group: " +
            error.message
        );
    }
}

/* ============================================================
   SAVE PROFILE
   ============================================================ */

async function saveProfile(){

    const input =
        document.getElementById(
            "profile-name"
        );


    if(!input){
        return;
    }


    const name =
        input.value.trim();


    if(!name){

        toast(
            "Enter a display name."
        );

        return;
    }


    try{

        await updateDoc(
            doc(
                db,
                "users",
                currentUser.uid
            ),
            {
                displayName:name
            }
        );


        await updateProfile(
            currentUser,
            {
                displayName:name
            }
        );


        currentProfile.displayName =
            name;


        toast(
            "Profile updated."
        );


        renderShell();


    }catch(error){

        console.error(
            "SAVE PROFILE ERROR:",
            error
        );


        toast(
            "Unable to update profile: " +
            error.message
        );
    }
}

function globalSearch(event){

    if(event.key !== "Enter"){
        return;
    }


    const value =
        event.target.value.trim();


    if(!value){
        return;
    }


    toast(
        "Search: " + value
    );
}

/* ============================================================
   FIREBASE AUTH STATE
   ============================================================ */

onAuthStateChanged(
    auth,

    async user => {

        currentUser =
            user;


        if(!user){

            currentProfile =
                null;

            currentChatId =
                null;

            renderAuth();

            return;
        }


        try{

            currentProfile =
                await loadProfile();


            if(!currentProfile){

                console.error(
                    "No Firestore user document found for:",
                    user.uid
                );


                document.getElementById(
                    "root"
                ).innerHTML = `

                    <div class="auth-screen">

                        <div class="auth-card">

                            <img
                                class="auth-logo"
                                src="https://balmuildyprimaryschool.tdf1.uk/balmuildy.png"
                                alt="Balmuildy logo"
                            >

                            <div class="auth-title">
                                Account setup incomplete
                            </div>

                            <p style="
                                text-align:center;
                                color:var(--muted);
                                line-height:1.6
                            ">

                                Your Firebase Authentication
                                account exists, but your Balmuildy
                                Assembly Firestore profile could
                                not be found.

                            </p>

                            <button
                                class="btn btn-secondary"
                                style="width:100%"
                                onclick="window.logout()"
                            >
                                Sign out
                            </button>

                        </div>

                    </div>

                `;

                return;
            }


            const hash =
                location.hash.replace(
                    "#",
                    ""
                );


            if(hash){

                currentView =
                    hash;

            }else{

                currentView =
                    "dashboard";

            }


            renderApp();


        }catch(error){

            console.error(
                "AUTH/PROFILE ERROR:",
                error
            );


            document.getElementById(
                "root"
            ).innerHTML = `

                <div class="auth-screen">

                    <div class="auth-card">

                        <div class="auth-title">
                            Unable to load account
                        </div>

                        <p style="
                            color:var(--muted);
                            text-align:center;
                            line-height:1.6
                        ">
                            ${escapeHTML(error.message)}
                        </p>

                        <button
                            class="btn btn-secondary"
                            style="width:100%"
                            onclick="window.logout()"
                        >
                            Sign out
                        </button>

                    </div>

                </div>

            `;
        }

    }
);
