<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Balmuildy Assembly</title>
<link rel="icon" href="https://balmuildyprimaryschool.tdf1.uk/balmuildy.png">

<style>
:root{
    --accent:#5b5fc7;
    --accent-dark:#4648a8;
    --bg:#f5f5f7;
    --panel:#fff;
    --panel2:#f0f1f5;
    --text:#202124;
    --muted:#6b6f76;
    --border:#e1e2e6;
    --danger:#d93025;
    --success:#16803c;
    --shadow:0 8px 30px rgba(0,0,0,.08);
}

*{box-sizing:border-box}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    font-family:Inter,Segoe UI,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
}

button,input,textarea,select{font:inherit}
button{cursor:pointer}

.app{
    display:flex;
    width:100%;
    height:100vh;
    overflow:hidden;
}

.sidebar{
    width:260px;
    background:#202124;
    color:white;
    display:flex;
    flex-direction:column;
    flex-shrink:0;
}

.brand{
    padding:18px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:1px solid rgba(255,255,255,.1);
}

.brand img{
    width:44px;
    height:44px;
    border-radius:10px;
    object-fit:contain;
    background:white;
    padding:3px;
}

.brand-text{font-weight:700}
.brand-text small{
    display:block;
    opacity:.6;
    font-weight:400;
    margin-top:2px;
}

.nav{padding:12px}

.nav button{
    width:100%;
    border:0;
    background:transparent;
    color:#ddd;
    padding:12px;
    border-radius:8px;
    text-align:left;
    margin-bottom:4px;
}

.nav button:hover,
.nav button.active{
    background:rgba(255,255,255,.1);
    color:white;
}

.sidebar-bottom{
    margin-top:auto;
    padding:12px;
    border-top:1px solid rgba(255,255,255,.1);
}

.user-mini{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px;
}

.avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    background:var(--accent);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    flex-shrink:0;
}

.user-mini-info{
    min-width:0;
}

.user-mini-info strong{
    display:block;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.user-mini-info small{color:#aaa}

.main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
}

.topbar{
    height:64px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    padding:0 20px;
    gap:15px;
}

.mobile-menu{
    display:none;
    border:0;
    background:none;
    font-size:22px;
}

.search{
    flex:1;
    max-width:600px;
}

.search input{
    width:100%;
    border:1px solid var(--border);
    background:var(--panel2);
    border-radius:8px;
    padding:11px 14px;
    outline:none;
}

.search input:focus{border-color:var(--accent)}

.top-actions{
    margin-left:auto;
    display:flex;
    gap:8px;
}

.icon-btn{
    width:40px;
    height:40px;
    border:0;
    border-radius:8px;
    background:transparent;
}

.icon-btn:hover{background:var(--panel2)}

.content{
    flex:1;
    overflow:auto;
    padding:25px;
}

.card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    box-shadow:var(--shadow);
}

.card-header{
    padding:18px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.card-body{padding:18px}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:18px;
}

.stat{padding:20px}
.stat-number{
    font-size:30px;
    font-weight:700;
}

.stat-label{
    color:var(--muted);
    margin-top:5px;
}

.btn{
    border:0;
    border-radius:7px;
    padding:10px 15px;
    font-weight:600;
}

.btn-primary{
    background:var(--accent);
    color:white;
}

.btn-primary:hover{background:var(--accent-dark)}

.btn-secondary{
    background:var(--panel2);
    color:var(--text);
}

.btn-danger{
    background:var(--danger);
    color:white;
}

.btn-success{
    background:var(--success);
    color:white;
}

.btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.auth-screen{
    width:100%;
    min-height:100vh;
    background:
        radial-gradient(circle at top left,#dfe2ff,transparent 40%),
        var(--bg);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.auth-card{
    width:100%;
    max-width:460px;
    background:white;
    border-radius:18px;
    box-shadow:0 20px 70px rgba(0,0,0,.15);
    padding:35px;
}

.auth-logo{
    display:block;
    width:100px;
    height:100px;
    object-fit:contain;
    margin:0 auto 20px;
}

.auth-title{
    text-align:center;
    font-size:27px;
    font-weight:750;
}

.auth-subtitle{
    text-align:center;
    color:var(--muted);
    margin:8px 0 25px;
}

.form-group{margin-bottom:16px}

.form-group label{
    display:block;
    font-weight:600;
    margin-bottom:7px;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    border:1px solid var(--border);
    border-radius:8px;
    padding:11px;
    outline:none;
    background:white;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
    border-color:var(--accent);
}

.auth-switch{
    text-align:center;
    margin-top:20px;
    color:var(--muted);
}

.auth-switch button{
    background:none;
    border:0;
    color:var(--accent);
    font-weight:700;
}

.chat-layout{
    display:grid;
    grid-template-columns:280px 1fr;
    height:calc(100vh - 114px);
    gap:15px;
}

.chat-list{overflow:auto}

.chat-item{
    padding:13px;
    display:flex;
    gap:10px;
    align-items:center;
    cursor:pointer;
    border-radius:8px;
    margin:3px;
}

.chat-item:hover,
.chat-item.active{
    background:var(--panel2);
}

.chat-main{
    display:flex;
    flex-direction:column;
    min-width:0;
}

.chat-header{
    padding:15px;
    border-bottom:1px solid var(--border);
    background:var(--panel);
    font-weight:700;
}

.messages{
    flex:1;
    overflow:auto;
    padding:20px;
    background:var(--bg);
}

.message{
    display:flex;
    gap:10px;
    margin-bottom:16px;
}

.message.mine{flex-direction:row-reverse}

.message-bubble{
    max-width:70%;
    background:var(--panel);
    border:1px solid var(--border);
    padding:10px 13px;
    border-radius:12px;
}

.mine .message-bubble{background:#e6e7ff}

.message-name{
    font-size:12px;
    color:var(--muted);
    margin-bottom:4px;
    font-weight:700;
}

.message-time{
    font-size:10px;
    color:var(--muted);
    margin-top:5px;
}

.message-actions{
    display:flex;
    gap:5px;
    margin-top:7px;
}

.message-actions button{
    border:0;
    background:none;
    color:var(--accent);
    font-size:11px;
    padding:2px 4px;
}

.edited-tag{
    color:var(--muted);
    font-size:10px;
    margin-left:5px;
}

.deleted-message{
    color:var(--muted);
    font-style:italic;
}

.chat-input{
    display:flex;
    gap:8px;
    padding:12px;
    border-top:1px solid var(--border);
    background:var(--panel);
}

.chat-input textarea{
    flex:1;
    resize:none;
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px;
    min-height:42px;
    max-height:120px;
}

.file-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px;
    border-bottom:1px solid var(--border);
}

.file-row:last-child{border-bottom:0}

.file-icon{font-size:26px}

.file-info{
    flex:1;
    min-width:0;
}

.file-name{
    font-weight:650;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.file-meta{
    color:var(--muted);
    font-size:12px;
    margin-top:3px;
}

.file-actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

.folder-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px;
    cursor:pointer;
    border-bottom:1px solid var(--border);
}

.folder-row:hover{background:var(--panel2)}

.folder-icon{font-size:25px}

.breadcrumbs{
    display:flex;
    align-items:center;
    gap:7px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.breadcrumbs button{
    border:0;
    background:none;
    color:var(--accent);
    padding:3px;
}

.group-card{
    padding:20px;
    cursor:pointer;
    transition:.15s;
}

.group-card:hover{transform:translateY(-2px)}

.badge{
    display:inline-block;
    border-radius:999px;
    padding:4px 9px;
    font-size:11px;
    font-weight:700;
}

.badge-pending{
    background:#fff3cd;
    color:#795900;
}

.badge-approved{
    background:#d9f7e5;
    color:#146c36;
}

.badge-admin{
    background:#e2e4ff;
    color:#41459a;
}

.badge-rejected{
    background:#ffe0df;
    color:#9c1d18;
}

.empty{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
}

.toast-container{
    position:fixed;
    bottom:20px;
    right:20px;
    z-index:2000;
}

.toast{
    background:#202124;
    color:white;
    padding:13px 17px;
    border-radius:8px;
    margin-top:8px;
    box-shadow:var(--shadow);
    max-width:400px;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    z-index:1500;
}

.modal-card{
    width:100%;
    max-width:500px;
    background:white;
    border-radius:14px;
    box-shadow:0 20px 70px rgba(0,0,0,.2);
    padding:22px;
}

@media(max-width:800px){
    .sidebar{
        position:fixed;
        z-index:900;
        left:-270px;
        top:0;
        bottom:0;
        transition:.2s;
    }

    .sidebar.open{left:0}

    .mobile-menu{display:block}

    .chat-layout{
        grid-template-columns:1fr;
        height:auto;
    }

    .chat-list{max-height:180px}

    .content{padding:15px}

    .topbar{padding:0 12px}

    .search{max-width:none}

    .message-bubble{max-width:85%}
}
</style>
</head>

<body>

<div id="root"></div>
<div id="toast-container" class="toast-container"></div>

<script type="module">

import {

} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,

} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

import {
    getFirestore,
    collection,

    addDoc,
    setDoc,
    getDoc,
    getDocs,
    updateDoc,
    deleteDoc,
    query,
    where,
    orderBy,
    onSnapshot,
    serverTimestamp,
    limit
} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

import {
    createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


/* ============================================================
   FIREBASE
   ============================================================ */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyClL16WbunPflZ6zZeHfif2K3XVBUlijBk",
  authDomain: "balmuildyprimaryschool.firebaseapp.com",
  projectId: "balmuildyprimaryschool",
  storageBucket: "balmuildyprimaryschool.firebasestorage.app",
  messagingSenderId: "767459231241",
  appId: "1:767459231241:web:1fde490389331f85f35ad8",
  measurementId: "G-DCTYENE246"
};


/* ============================================================
   SUPABASE
   ============================================================ */

const SUPABASE_URL =
    "https://ehcbvkgdhflzxrahwylw.supabase.co";

/*
   IMPORTANT:

   Replace this with your Supabase anon/publishable key.

   NEVER put your Supabase service_role key here.
*/

const SUPABASE_ANON_KEY =
    "sb_publishable_XrBEi0g7xmLwEobBAhaZwA_vaJYMrX6";

const SUPABASE_BUCKET =
    "balmuildy-files";


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


const supabase =
    createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* ============================================================
   STATE
   ============================================================ */

let currentUser = null;
let currentProfile = null;

let currentView =
    location.hash.replace("#","") ||
    "dashboard";

let currentChatId = null;
let currentChatName = null;

let currentChatUnsubscribe = null;
let currentFilesUnsubscribe = null;

let currentFolder = "";


/* ============================================================
   HELPERS
   ============================================================ */

function escapeHTML(value){

    if(value === undefined || value === null){
        return "";
    }

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function initials(name){

    if(!name){
        return "?";
    }

    return name
        .trim()
        .split(/\s+/)
        .map(x => x[0])
        .slice(0,2)
        .join("")
        .toUpperCase();
}


function toast(message){

    const container =
        document.getElementById("toast-container");

    if(!container){
        return;
    }

    const item =
        document.createElement("div");

    item.className = "toast";
    item.textContent = message;

    container.appendChild(item);

    setTimeout(
        () => item.remove(),
        4500
    );
}


function formatDate(timestamp){

    if(!timestamp){
        return "";
    }

    try{
        if(typeof timestamp.toDate === "function"){
            return timestamp.toDate().toLocaleString();
        }

        return new Date(timestamp).toLocaleString();

    }catch{
        return "";
    }
}


function safePath(path){

    return String(path || "")
        .replace(/^\/+/,"")
        .replace(/\/+/g,"/")
        .replace(/\.\./g,"");
}


function filePath(){

    return currentFolder
        ? currentFolder + "/"
        : "";
}


function publicFileUrl(path){

    return (
        SUPABASE_URL +
        "/storage/v1/object/public/" +
        SUPABASE_BUCKET +
        "/" +
        path
            .split("/")
            .map(encodeURIComponent)
            .join("/")
    );
}


/* ============================================================
   NAVIGATION
   ============================================================ */

function navigate(view){

    currentView = view;
    location.hash = view;

    renderApp();
}


window.addEventListener(
    "hashchange",
    () => {

        currentView =
            location.hash.replace("#","") ||
            "dashboard";

        renderApp();
    }
);


/* ============================================================
   AUTH
   ============================================================ */

function renderAuth(){

    document.getElementById("root").innerHTML = `

        <div class="auth-screen">

            <div class="auth-card">

                <img
                    class="auth-logo"
                    src="https://balmuildyprimaryschool.tdf1.uk/balmuildy.png"
                    alt="Balmuildy logo"
                >

                <div class="auth-title">
                    Balmuildy Assembly
                </div>

                <div class="auth-subtitle">
                    Sign in to your school workspace
                </div>

                <form id="login-form">

                    <div class="form-group">
                        <label>Email</label>

                        <input
                            id="login-email"
                            type="email"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Password</label>

                        <input
                            id="login-password"
                            type="password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button
                        class="btn btn-primary"
                        style="width:100%"
                        type="submit"
                    >
                        Sign in
                    </button>

                </form>

                <div class="auth-switch">

                    Don't have an account?

                    <button id="show-signup">
                        Create account
                    </button>

                </div>

            </div>

        </div>
    `;

    document
        .getElementById("login-form")
        .addEventListener("submit",login);

    document
        .getElementById("show-signup")
        .addEventListener("click",renderSignup);
}


function renderSignup(){

    document.getElementById("root").innerHTML = `

        <div class="auth-screen">

            <div class="auth-card">

                <img
                    class="auth-logo"
                    src="https://balmuildyprimaryschool.tdf1.uk/balmuildy.png"
                    alt="Balmuildy logo"
                >

                <div class="auth-title">
                    Join Balmuildy Assembly
                </div>

                <div class="auth-subtitle">
                    Your account must be approved by an administrator.
                </div>

                <form id="signup-form">

                    <div class="form-group">
                        <label>Display name</label>

                        <input
                            id="signup-name"
                            maxlength="50"
                            placeholder="Your name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Email</label>

                        <input
                            id="signup-email"
                            type="email"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Password</label>

                        <input
                            id="signup-password"
                            type="password"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <button
                        class="btn btn-primary"
                        style="width:100%"
                        type="submit"
                    >
                        Request access
                    </button>

                </form>

                <div class="auth-switch">

                    Already have an account?

                    <button id="show-login">
                        Sign in
                    </button>

                </div>

            </div>

        </div>
    `;

    document
        .getElementById("signup-form")
        .addEventListener("submit",signup);

    document
        .getElementById("show-login")
        .addEventListener("click",renderAuth);
}


async function login(event){

    event.preventDefault();

    const email =
        document
        .getElementById("login-email")
        .value
        .trim();

    const password =
        document
        .getElementById("login-password")
        .value;

    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    }catch(error){

        console.error(error);
        toast(friendlyAuthError(error));

    }
}


async function signup(event){

    event.preventDefault();

    const name =
        document
        .getElementById("signup-name")
        .value
        .trim();

    const email =
        document
        .getElementById("signup-email")
        .value
        .trim();

    const password =
        document
        .getElementById("signup-password")
        .value;

    if(!name){
        toast("Please enter a display name.");
        return;
    }

    if(password.length < 8){
        toast("Password must be at least 8 characters.");
        return;
    }

    try{

        toast("Creating account...");

        const credential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );

        const user =
            credential.user;

        await updateProfile(
            user,
            {displayName:name}
        );

        await setDoc(
            doc(db,"users",user.uid),
            {
                uid:user.uid,
                email,
                displayName:name,
                role:"member",
                status:"pending",
                createdAt:serverTimestamp()
            }
        );

        toast(
            "Account created. Waiting for approval."
        );

        await signOut(auth);

        renderAuth();

    }catch(error){

        console.error(error);
        toast(friendlyAuthError(error));

    }
}


function friendlyAuthError(error){

    const code = error?.code || "";

    if(code === "auth/email-already-in-use")
        return "That email address is already registered.";

    if(code === "auth/invalid-email")
        return "Please enter a valid email address.";

    if(code === "auth/weak-password")
        return "The password is too weak.";

    if(
        code === "auth/invalid-credential" ||
        code === "auth/user-not-found" ||
        code === "auth/wrong-password"
    )
        return "Incorrect email or password.";

    if(code === "permission-denied")
        return "Firestore permission denied.";

    return error?.message || "Something went wrong.";
}


/* ============================================================
   PROFILE
   ============================================================ */

async function loadProfile(){

    if(!currentUser){
        return null;
    }

    const snapshot =
        await getDoc(
            doc(db,"users",currentUser.uid)
        );

    if(!snapshot.exists()){
        return null;
    }

    return {
        id:snapshot.id,
        ...snapshot.data()
    };
}


/* ============================================================
   APP
   ============================================================ */

function renderApp(){

    if(!currentUser){
        renderAuth();
        return;
    }

    if(!currentProfile){

        document.getElementById("root").innerHTML = `
            <div class="auth-screen">
                <div class="auth-card">
                    <div class="auth-title">Loading...</div>
                    <p style="text-align:center;color:var(--muted)">
                        Loading your account.
                    </p>
                </div>
            </div>
        `;

        return;
    }

    if(currentProfile.status !== "approved"){
        renderPending();
        return;
    }

    renderShell();
}


function renderPending(){

async function loadChats(){

    const container =
        document.getElementById("chat-list-content");

    try{

        const snapshot =
            await getDocs(
                query(
                    collection(db,"chats"),
                    where(
                        "participants",
                        "array-contains",
                        currentUser.uid
                    ),
                    limit(50)
                )
            );

        if(snapshot.empty){

            container.innerHTML = `
                <div class="empty">
                    No chats yet.
                    <br><br>
                    Go to Members and select someone.
                </div>
            `;

            return;
        }

        let html = "";

        for(const chatDoc of snapshot.docs){

            const chat = chatDoc.data();

            const otherUid =
                chat.participants.find(
                    uid => uid !== currentUser.uid
                );

            if(!otherUid){
                continue;
            }

            const other =
                await getDoc(
                    doc(db,"users",otherUid)
                );

            if(!other.exists()){
                continue;
            }

            const user = other.data();

            html += `

                <div
                    class="chat-item ${
                        currentChatId === chatDoc.id
                        ? "active"
                        : ""
                    }"
                    onclick="window.openChat(
                        '${chatDoc.id}',
                        '${escapeHTML(user.displayName)}'
                    )"
                >

                    <div class="avatar">
                        ${initials(user.displayName)}
                    </div>

                    <div>
                        <strong>
                            ${escapeHTML(user.displayName)}
                        </strong>
                    </div>

                </div>
            `;
        }

        container.innerHTML =
            html ||
            `<div class="empty">No chats yet.</div>`;

    }catch(error){

        console.error(error);

        container.innerHTML = `
            <div class="empty">
                Unable to load chats.
                <br><br>
                <small>${escapeHTML(error.message)}</small>
            </div>
        `;
    }
}


async function startChat(otherUid){

    try{

        const snapshot =
            await getDocs(
                query(
                    collection(db,"chats"),
                    where(
                        "participants",
                        "array-contains",
                        currentUser.uid
                    )
                )
            );

        for(const item of snapshot.docs){

            const chat = item.data();

            if(
                chat.participants.length === 2 &&
                chat.participants.includes(otherUid)
            ){

                const other =
                    await getDoc(
                        doc(db,"users",otherUid)
                    );

                const name =
                    other.exists()
                    ? other.data().displayName
                    : "Chat";

                currentChatId = item.id;
                currentChatName = name;

                navigate("chat");

                return;
            }
        }

        const chatRef =
            await addDoc(
                collection(db,"chats"),
                {
                    participants:[
                        currentUser.uid,
                        otherUid
                    ],
                    type:"direct",
                    createdAt:serverTimestamp(),
                    lastMessage:"",
                    lastMessageAt:serverTimestamp()
                }
            );

        const other =
            await getDoc(
                doc(db,"users",otherUid)
            );

        currentChatId =
            chatRef.id;

        currentChatName =
            other.exists()
            ? other.data().displayName
            : "Chat";

        navigate("chat");

    }catch(error){

        console.error(error);

        toast(
            "Unable to start chat: " +
            error.message
        );
    }
}


function openChat(chatId,name){

    currentChatId = chatId;
    currentChatName = name;

    const header =
        document.getElementById("chat-header");

    if(header){
        header.textContent = name;
    }

    const input =
        document.getElementById("message-input");

    const button =
        document.getElementById("send-message");

    if(input) input.disabled = false;
    if(button) button.disabled = false;

    if(currentChatUnsubscribe){
        currentChatUnsubscribe();
        currentChatUnsubscribe = null;
    }

    const messagesQuery =
        query(
            collection(
                db,
                "chats",
                chatId,
                "messages"
            ),
            orderBy("createdAt","asc")
        );

    currentChatUnsubscribe =
        onSnapshot(
            messagesQuery,
            snapshot => {

                const container =
                    document.getElementById("messages");

                if(!container){
                    return;
                }

                let html = "";

                snapshot.forEach(messageDoc => {

                    const message =
                        messageDoc.data();

                    const mine =
                        message.senderId ===
                        currentUser.uid;

                    const deleted =
                        message.deleted === true;

                    html += `

                        <div
                            class="message ${
                                mine ? "mine" : ""
                            }"
                        >

                            <div class="avatar">
                                ${initials(message.senderName)}
                            </div>

                            <div class="message-bubble">

                                <div class="message-name">

                                    ${escapeHTML(message.senderName)}

                                </div>

                                <div class="${
                                    deleted
                                    ? "deleted-message"
                                    : ""
                                }">

                                    ${
                                        deleted
                                        ? "This message was deleted"
                                        : escapeHTML(message.text)
                                    }

                                    ${
                                        message.edited && !deleted
                                        ? `<span class="edited-tag">Edited</span>`
                                        : ""
                                    }

                                </div>

                                <div class="message-time">

                                    ${formatDate(message.createdAt)}

                                </div>

                                ${
                                    mine && !deleted
                                    ? `
                                        <div class="message-actions">

                                            <button
                                                onclick="window.editMessage(
                                                    '${chatId}',
                                                    '${messageDoc.id}',
                                                    '${encodeURIComponent(message.text || "")}'
                                                )"
                                            >
                                                Edit
                                            </button>

                                            <button
                                                onclick="window.deleteMessage(
                                                    '${chatId}',
                                                    '${messageDoc.id}'
                                                )"
                                            >
                                                Delete
                                            </button>

                                        </div>
                                    `
                                    : ""
                                }

                            </div>

                        </div>
                    `;
                });

                container.innerHTML =
                    html ||
                    `<div class="empty">No messages yet.</div>`;

                container.scrollTop =
                    container.scrollHeight;
            },
            error => {

                console.error(error);

                toast(
                    "Unable to load messages."
                );
            }
        );
}


async function sendMessage(event){

    event.preventDefault();

    if(!currentChatId){
        return;
    }

    const input =
        document.getElementById("message-input");

    const text =
        input.value.trim();

    if(!text){
        return;
    }

    input.value = "";

    try{

        await addDoc(
            collection(
                db,
                "chats",
                currentChatId,
                "messages"
            ),
            {
                senderId:currentUser.uid,
                senderName:currentProfile.displayName,
                text,
                edited:false,
                deleted:false,
                createdAt:serverTimestamp()
            }
        );

        await updateDoc(
            doc(
                db,
                "chats",
                currentChatId
            ),
            {
                lastMessage:text,
                lastMessageAt:serverTimestamp()
            }
        );

    }catch(error){

        console.error(error);

        toast(
            "Unable to send message: " +
            error.message
        );
    }
}

    const text =

                "messages",

                edited:true,
                editedAt:serverTimestamp()
            }
        );

    }catch(error){

        console.error(error);

        toast(
            "Unable to edit message: " +
            error.message
        );

}

async function loadFiles(){

    const container =
        document.getElementById("files-list");

    if(!container){
        return;
    }

    container.innerHTML =
        `<div class="empty">Loading files...</div>`;

    try{

        const prefix =
            filePath();

        /*
           Supabase lists objects in the current folder.

           We use a small amount of metadata from the
           object list to distinguish files and folders.
        */

        const {
            data,
            error
        } =
            await supabase.storage
            .from(SUPABASE_BUCKET)
            .list(
                currentFolder,
                {
                    limit:1000,
                    offset:0,
                    sortBy:{
                        column:"name",
                        order:"asc"
                    }
                }
            );

        if(error){
            throw error;
        }

        const objects =
            Array.isArray(data)
            ? data
            : [];

        let folders = [];
        let files = [];

        objects.forEach(object => {

            /*
               Supabase represents folders created through
               Storage as folder entries when listing.
            */

            if(
                object.id === null &&
                object.name
            ){
                folders.push(object);
            }else if(object.name){
                files.push(object);
            }
        });

        let html = "";

        folders.forEach(folder => {

            const path =
                prefix + folder.name;

            html += `

                <div class="folder-row">

                    <div
                        class="folder-icon"
                        onclick="window.openFolder(
                            '${encodeURIComponent(path)}'
                        )"
                    >
                        📁
                    </div>

                    <div
                        class="file-info"
                        onclick="window.openFolder(
                            '${encodeURIComponent(path)}'
                        )"
                    >

                        <div class="file-name">
                            ${escapeHTML(folder.name)}
                        </div>

                        <div class="file-meta">
                            Folder
                        </div>

                    </div>

                    <button
                        class="btn btn-danger"
                        onclick="window.deleteFolder(
                            '${encodeURIComponent(path)}'
                        )"
                    >
                        Delete
                    </button>

                </div>
            `;
        });

        files.forEach(file => {

            const path =
                prefix + file.name;

            const url =
                publicFileUrl(path);

            html += `

                <div class="file-row">

                    <div class="file-icon">
                        📄
                    </div>

                    <div class="file-info">

                        <div class="file-name">
                            ${escapeHTML(file.name)}
                        </div>

                        <div class="file-meta">

                            ${
                                file.metadata?.mimetype ||
                                "File"
                            }

                            ${
                                file.updated_at
                                ? " · " +
                                  new Date(
                                      file.updated_at
                                  ).toLocaleString()
                                : ""
                            }

                        </div>

                    </div>

                    <div class="file-actions">

                        <button
                            class="btn btn-secondary"
                            onclick="window.openPublicFile(
                                '${encodeURIComponent(path)}'
                            )"
                        >
                            Open
                        </button>

                        <button
                            class="btn btn-danger"
                            onclick="window.deleteStoredFile(
                                '${encodeURIComponent(path)}'
                            )"
                        >
                            Delete
                        </button>

                    </div>

                </div>
            `;
        });

        if(!html){

            html = `
                <div class="empty">
                    This folder is empty.
                </div>
            `;
        }

        container.innerHTML = html;

    }catch(error){

        console.error(
            "SUPABASE FILE ERROR:",
            error
        );

        container.innerHTML = `

            <div class="empty">

                Unable to load files.

                <br><br>

                <small>
                    ${escapeHTML(error.message)}
                </small>

            </div>
        `;
    }
}

/* ============================================================
   UPLOAD
   ============================================================ */

async function uploadFile(){

    const input =
        document.getElementById("file-upload");

    const progress =
        document.getElementById("upload-progress");

    if(!input || !input.files.length){

        toast("Please select a file.");

        return;
    }

    const file =
        input.files[0];

    const path =
        filePath() +
        file.name;

    try{

        progress.textContent =
            "Uploading " + file.name + "...";

        const {
            error
        } =
            await supabase.storage
            .from(SUPABASE_BUCKET)
            .upload(
                path,
                file,
                {
                    cacheControl:"3600",
                    upsert:false
                }
            );

        if(error){
            throw error;
        }

        toast(
            "File uploaded successfully."
        );

        hideUpload();

        await loadFiles();

    }catch(error){

        console.error(
            "UPLOAD ERROR:",
            error
        );

        if(
            error.message &&
            error.message.toLowerCase().includes("duplicate")
        ){

            toast(
                "A file with that name already exists."
            );

        }else{

            toast(
                "Unable to upload file: " +
                error.message
            );
        }

        if(progress){
            progress.textContent = "";
        }
    }
}

async function createFolder(){

    const name =
        prompt(
            "Folder name:"
        );

    if(!name){
        return;
    }

    const clean =
        name
        .trim()
        .replace(/[\/\\]/g,"-");

    if(!clean){
        return;
    }

    const path =
        filePath() +
        clean +
        "/.folder";

    try{

        const {
            error
        } =
            await supabase.storage
            .from(SUPABASE_BUCKET)
            .upload(
                path,
                new Blob(
                    [""],
                    {type:"text/plain"}
                ),
                {
                    upsert:false
                }
            );

        if(error){
            throw error;
        }

        toast(
            "Folder created."
        );

        await loadFiles();

    }catch(error){

        console.error(error);

        toast(
            "Unable to create folder: " +
            error.message
        );
    }
}

/* ============================================================
   DELETE FOLDER
   ============================================================ */

async function deleteFolder(
    encodedPath
){

    const folder =
        safePath(
            decodeURIComponent(encodedPath)
        );

    if(
        !confirm(
            "Delete this folder and everything inside it?"
        )
    ){
        return;
    }

    try{

        await deleteFolderRecursive(folder);

        toast(
            "Folder deleted."
        );

        await loadFiles();

    }catch(error){

        console.error(error);

        toast(
            "Unable to delete folder: " +
            error.message
        );
    }
}


async function deleteFolderRecursive(
    folder
){

    const {
        data,
        error
    } =
        await supabase.storage
        .from(SUPABASE_BUCKET)
        .list(
            folder,
            {
                limit:1000,
                offset:0
            }
        );

    if(error){
        throw error;
    }

    const objects =
        Array.isArray(data)
        ? data
        : [];

    const files = [];
    const folders = [];

    objects.forEach(object => {

        if(
            object.id === null &&
            object.name
        ){

            folders.push(
                folder + "/" + object.name
            );

        }else if(object.name){

            files.push(
                folder + "/" + object.name
            );
        }
    });

    for(
        const childFolder
        of folders
    ){

        await deleteFolderRecursive(
            childFolder
        );
    }

    if(files.length){

        const {
            error:removeError
        } =
            await supabase.storage
            .from(SUPABASE_BUCKET)
            .remove(files);

        if(removeError){
            throw removeError;
        }
    }

    /*
       Remove the folder marker.
    */

    const marker =
        folder + "/.folder";

    await supabase.storage
        .from(SUPABASE_BUCKET)
        .remove([marker]);
}
